[package]
name = "nix-notify"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
django-rs = { git = "https://git.ole.blue/DestinyofYeet/django-rs", version = "0.1.0" }
rss = "2.1.0"
signal-hook = { version = "0.4.4", features = ["extended-siginfo"] }
thiserror = "2.0.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
